# Database Configuration for Online Library Management System
db.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
db.pool.maximumPoolSize=15
db.pool.minimumIdle=5
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1200000

# Library Business Policy Configurations
library.policy.maxActiveLoans=5
library.policy.defaultLoanDays=14
library.policy.maxRenewals=2
library.policy.dailyFineRate=2.50
library.policy.reservationExpiryHours=48
library.policy.maxDailyReadingRoomBookings=2
